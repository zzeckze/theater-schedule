<!doctype html>
<html lang="ko">  
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171b2d">
<title>THEATER-CLOWN · 공연팀 관리</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#171b2d;--muted:#73798c;--primary:#6657e8;--accent:#ff6b8a;--line:#e7e8ef;--danger:#e84b5f;--ok:#20a36a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
#app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg)}
header{position:sticky;top:0;z-index:20;background:rgba(245,246,250,.95);backdrop-filter:blur(12px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between}.brand b{font-size:18px}.brand small{color:var(--muted)}
.toplinks{display:flex;gap:7px;overflow:auto;padding-top:12px}.toplinks button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:#444b60}
main{padding:14px 16px 100px}.hero{background:linear-gradient(135deg,#171b2d,#6657e8);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px}.hero .dday{font-size:42px;font-weight:800;line-height:1}.hero p{margin:8px 0 0;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0}.card h3{margin:0 0 12px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#f0efff;color:var(--primary);font-size:12px;font-weight:700}
.notice{padding:13px;border-radius:15px;background:#fff3f6;border:1px solid #ffd5df}.schedule-item{padding:13px 0;border-bottom:1px solid var(--line)}.schedule-item:last-child{border-bottom:0}.time{font-size:17px;font-weight:800}.people{font-size:13px;color:var(--muted);margin-top:5px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.bottom button{background:none;color:#74798a;font-size:11px;padding:5px 0}.bottom button.active{color:var(--primary);font-weight:800}.bottom span{display:block;font-size:20px;margin-bottom:2px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.section-title h2{font-size:20px;margin:0}.seg{display:flex;background:#ececf3;padding:3px;border-radius:12px;margin:10px 0}.seg button{flex:1;background:transparent;border-radius:9px;padding:8px;color:#666}.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 5px #00000012}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{text-align:center;font-size:11px;color:var(--muted);padding:4px}.day{min-height:70px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px}.day b{display:block}.dot{display:block;margin-top:5px;font-size:10px;color:var(--primary);font-weight:700}.dot.stage{color:#d77b1d}.dot.show{color:#e84b5f}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 13px;border-radius:12px;background:#f0efff;color:var(--primary);font-weight:700}.btn.primary{background:var(--primary);color:var(--button-text,#fff)}.btn.ghost{background:#fff;border:1px solid var(--line);color:#555}.btn.danger{background:#fff0f2;color:var(--danger)}
.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px}.chip.on{background:#eeecff;border-color:#c9c3ff;color:var(--primary);font-weight:700}
.notice-list .card{margin-bottom:8px}.media{height:120px;border-radius:14px;background:#eef0f7;display:grid;place-items:center;color:#858b9b;margin-bottom:10px}
.login{min-height:100vh;display:grid;place-items:center;padding:28px 22px;background:linear-gradient(160deg,#171b2d 0%,#6657e8 70%,#ff6b8a 140%);color:#fff}.loginbox{width:100%;max-width:390px}.logo{
  font-size:46px;
  font-weight:900;
  letter-spacing:.5px;
  line-height:1.02;
  width:100%;
  max-width:100%;
}
.logo-line{
  display:block;
  width:100%;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}
.logo.login-font-bold{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.logo.login-font-script{font-family:"Nanum Pen Script","Segoe Print",cursive;font-weight:400;letter-spacing:.01em}
.logo.login-font-serif{font-family:"Nanum Myeongjo","Noto Serif KR",Georgia,serif;font-weight:700}
.logo.login-font-clean{font-family:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:700;letter-spacing:.03em}.loginbox p{opacity:.75}.loginbtn{width:100%;padding:14px;border-radius:14px;margin:7px 0;font-weight:800}.codebtn{background:#fff;color:#171b2d}.fine{font-size:11px;opacity:.65;line-height:1.5;margin-top:14px;text-align:center}
.adminbar{background:#fff4d8;border:1px solid #ffe2a1;border-radius:15px;padding:11px 12px;margin:10px 0;color:#725314;font-size:13px}
.listline{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.listline:last-child{border-bottom:0}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.small{font-size:12px}
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.modal-card{
  width:min(500px,100%);
  max-height:85vh;
  overflow:auto;
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-sizing:border-box;
}

.time-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:15px;
}

.time-slot{
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  padding:10px 4px;
  cursor:pointer;
}

.time-slot.on{
  background:#171b2d;
  color:#fff;
  border-color:#171b2d;
}
  .availability-calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.availability-calendar{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
  width:100%;
}

.availability-calendar .calhead{
  min-width:0;
  text-align:center;
  padding:7px 0;
  font-size:12px;
  color:var(--muted);
}
  .availability-calendar-wrap{
  width:100%;
  background:#f8f8fc;
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
}

.availability-calendar-header .btn{
  min-width:40px;
  padding:8px 10px;
}

.availability-calendar-header b{
  font-size:16px;
}

.availability-day{
  width:100%;
  min-height:54px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 4px;
  font-size:13px;
  text-align:center;
  color:var(--ink);
  transition:.15s;
}

.availability-day:active{
  transform:scale(.96);
}

.availability-day.selected{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
  font-weight:800;
  box-shadow:0 3px 8px rgba(102,87,232,.25);
}

.availability-day.empty{
  background:transparent;
  border:0;
  pointer-events:none;
}

.availability-day.selected{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.availability-day.empty{
  background:transparent;
  border:0;
}

.time-slot.range-start{
  outline:2px solid var(--accent);
  outline-offset:1px;
}

  .aggregate-availability{
  margin-top:10px;
}

.aggregate-calendar{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
  width:100%;
}

.aggregate-calendar .calhead{
  min-width:0;
  text-align:center;
  padding:7px 0;
  font-size:12px;
  color:var(--muted);
}

.aggregate-day{
  width:100%;
  min-height:68px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:7px 3px;
  font-size:12px;
  text-align:center;
}

.aggregate-day.has-data{
  border-color:#c9c3ff;
  background:#faf9ff;
}

.aggregate-day.selected{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.aggregate-day.empty{
  background:transparent;
  border:0;
}

.aggregate-count{
  display:block;
  margin-top:5px;
  font-size:9px;
  font-weight:700;
  color:var(--primary);
}

.aggregate-day.selected .aggregate-count{
  color:#fff;
}

.aggregate-detail{
  margin-top:12px;
  padding:12px;
  background:#f7f7fb;
  border-radius:14px;
}

.aggregate-person{
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.aggregate-person:last-child{
  border-bottom:0;
}

.aggregate-time{
  margin-top:5px;
  font-size:12px;
  color:var(--muted);
}
  

/* ===== Final navigation / content / modal improvements ===== */
.toplinks{display:none!important}
.bottom{grid-template-columns:repeat(5,1fr)}
.content-scroll{max-height:260px;overflow-y:auto;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}
.tc-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10000}
.tc-modal{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.tc-modal h3{margin:0 0 14px}.tc-month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.tc-month-head button{background:#f0efff;color:var(--primary);border-radius:10px;padding:8px 11px}
.tc-week,.tc-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.tc-week span{text-align:center;font-size:11px;color:var(--muted);padding:4px}.tc-day{min-height:42px;background:#fff;border:1px solid var(--line);border-radius:10px}.tc-day.sel{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:800}.tc-day.empty{background:transparent;border:0}
.tc-time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:240px;overflow:auto}.tc-time-btn{padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:#fff}.tc-time-btn.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.tc-types{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tc-type{padding:10px 5px;border:1px solid var(--line);border-radius:12px;background:#fff}.tc-type.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.tc-actions{display:flex;gap:8px;margin-top:16px}.tc-actions>*{flex:1}
.aggregate-day.filtered-common{background:#e9e4ff;border-color:#8d7ff0;color:#30276e;box-shadow:inset 0 0 0 2px #cfc8ff}.aggregate-day.filtered-common .aggregate-count{color:#5d4ee0}.aggregate-time-range{display:block;margin-top:3px;font-size:9px;line-height:1.25;font-weight:800;color:#4b43a5}.aggregate-day.selected{outline:2px solid var(--accent);outline-offset:1px}.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.color-row{display:flex;align-items:center;gap:8px}.color-row input[type=color]{width:52px;height:38px;padding:2px;border:1px solid var(--line);border-radius:10px;background:#fff}
@media(max-width:430px){.tc-time-grid{grid-template-columns:repeat(3,1fr)}.tc-types{grid-template-columns:repeat(2,1fr)}}


.swatches{display:flex;flex-wrap:wrap;gap:7px}.palette-grid{display:grid;grid-template-columns:repeat(6,30px);grid-auto-rows:30px;gap:7px;width:max-content;max-width:100%}.swatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.12);cursor:pointer}.swatch.sel{outline:3px solid #171b2d!important;outline-offset:2px;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(23,27,45,.18)!important;transform:scale(1.06)}.tc-inline-edit{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.tc-inline-edit textarea{width:100%;min-height:90px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px}.schedule-item .time{font-weight:800}.schedule-item .date-line{font-weight:800}.schedule-item .kind-line{opacity:.7;font-size:12px;margin-top:3px}.tc-time-grid{max-height:260px;overflow:auto}
.dday-editor{background:var(--dday-bg);color:var(--dday-text);padding:18px;border-radius:18px;margin-bottom:12px}.dday-editor .card{color:var(--ink)}.dday-editor .field label{color:inherit}.tc-small-control{font-size:11px!important;padding:6px 8px!important}.chips .chip{font-size:12px;padding:7px 9px}.schedule-item .date-line,.schedule-item .time,.schedule-item .kind-line{display:block}.schedule-item .date-line{font-size:13px}.schedule-item .time{font-size:15px;margin-top:2px}.schedule-item .kind-line{font-weight:800;font-size:13px;margin-top:2px}.schedule-item .content-note{font-weight:400;font-size:13px;margin-top:3px}.content-scroll{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-height:220px;overflow:auto}
.schedule-card .schedule-date{font-size:20px;font-weight:900;line-height:1.2;margin-bottom:4px}.schedule-card .schedule-time{font-size:15px;font-weight:800}.schedule-card .schedule-kind{font-size:13px;font-weight:800;margin-top:5px}.schedule-people,.schedule-memo{margin-top:8px;font-size:13px}.schedule-special-note{margin-top:9px}.schedule-card .schedule-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.schedule-card .schedule-main{min-width:0}.schedule-card .pill{flex:none}.tc-aggregate-display{display:block;white-space:nowrap;font-size:11px;line-height:1.25;margin-top:2px}

/* ===== v8: aggregate calendar readability + unified controls/badges ===== */
.pill{background:var(--badge-bg,#6657e8)!important;color:var(--badge-text,#fff)!important;border-color:var(--badge-bg,#6657e8)!important}
.aggregate-calendar{gap:7px}
.aggregate-calendar .calhead{font-size:12px;padding:8px 0}
.aggregate-day{min-height:88px;padding:8px 3px;border-radius:13px;font-size:13px;line-height:1.15}
.aggregate-day>b{display:block;font-size:14px;line-height:1;font-weight:900}
.aggregate-count{margin-top:7px;font-size:10px;line-height:1.3;font-weight:800;white-space:normal;overflow-wrap:anywhere;word-break:keep-all}
@media(max-width:430px){.aggregate-day{min-height:82px;padding:7px 2px}.aggregate-day>b{font-size:13px}.aggregate-count{font-size:9.5px}}

/* v9: button palette is split by role/location, not physical dimensions.
   Large group: bottom navigation, segmented page filters, and member-name buttons in availability.
   Small group: all remaining normal clickable controls. Danger/cancel/delete remain red. */
.btn:not(.danger),
.loginbtn:not(.danger),
.tc-month-head button:not(.danger),
.time-slot:not(.danger),
.tc-time-btn:not(.danger),
.tc-type:not(.danger),
.chip:not(.danger){background:var(--small-button-bg,var(--primary))!important;color:var(--small-button-text,var(--button-text,#fff))!important;border-color:var(--small-button-bg,var(--primary))!important}
.btn:not(.danger).ghost{background:var(--small-button-bg,var(--primary))!important;color:var(--small-button-text,var(--button-text,#fff))!important;border-color:var(--small-button-bg,var(--primary))!important}
/* Large-button group requested by administrator settings */
.bottom button:not(.danger),
.seg button:not(.danger),
button[data-member]:not(.danger){background:var(--large-button-bg,var(--primary))!important;color:var(--large-button-text,var(--button-text,#fff))!important;border-color:var(--large-button-bg,var(--primary))!important}
.tc-day.sel,.availability-day.selected,.aggregate-day.selected{background:var(--small-button-bg,var(--primary))!important;color:var(--small-button-text,var(--button-text,#fff))!important;border-color:var(--small-button-bg,var(--primary))!important}
.tc-time-btn.sel,.tc-type.sel,.chip.on,.time-slot.on{color:var(--small-button-text,var(--button-text,#fff))!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.seg button.active,.bottom button.active,button[data-member].active{color:var(--large-button-text,var(--button-text,#fff))!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.aggregate-day.selected .aggregate-count{color:var(--small-button-text,var(--button-text,#fff))!important}
.btn.danger{background:#fff0f2!important;color:var(--danger)!important;border-color:#ffd2d9!important}


/* ===== v16: persistent visual feedback for selectable buttons =====
   Selected/toggled controls remain visibly different until the selection is cleared.
   When their state class is removed, they automatically return to the administrator-set base colors. */
button,.btn,.chip,.time-slot,.tc-time-btn,.tc-type,.tc-day,.availability-day,.aggregate-day{
  transition:filter .14s ease,box-shadow .14s ease,transform .14s ease,opacity .14s ease;
}

/* Small selectable controls */
.tc-time-btn.sel,
.tc-type.sel,
.chip.on,
.time-slot.on,
.tc-day.sel,
.availability-day.selected,
.aggregate-day.selected{
  filter:brightness(.82) saturate(1.08)!important;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.58),0 2px 7px rgba(23,27,45,.16)!important;
  transform:translateY(1px);
  font-weight:800;
}

/* Large selectable controls: bottom menu, segmented filters, member-name controls */
.seg button.active,
.bottom button.active,
button[data-member].active{
  filter:brightness(.82) saturate(1.08)!important;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.58),0 2px 7px rgba(23,27,45,.16)!important;
  transform:translateY(1px);
  font-weight:800;
}

/* Preserve clear selection even when the chosen administrator color is black. */
.tc-time-btn.sel,
.tc-type.sel,
.chip.on,
.time-slot.on,
.tc-day.sel,
.availability-day.selected,
.aggregate-day.selected,
.seg button.active,
.bottom button.active,
button[data-member].active{
  outline:2px solid rgba(23,27,45,.32);
  outline-offset:-2px;
}

/* Non-persistent press feedback for action buttons only. */
button:not(.swatch):active{
  transform:translateY(1px) scale(.985);
}


/* ===== v21: schedule-add time layout =====
   Each selected date owns the full modal width; multiple dates stack vertically. */
.sm-times-list{display:block;width:100%;margin-top:8px}
.sm-time-date-block{
  display:block;
  width:100%;
  margin:12px 0 16px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.42);
}
.sm-time-date-title{display:block;margin:0 0 9px;font-size:14px}
.sm-time-grid{width:100%;grid-template-columns:repeat(6,minmax(0,1fr));max-height:none;overflow:visible}
.sm-time-grid .tc-time-btn{min-width:0;padding-left:2px;padding-right:2px;font-size:12px}
@media(max-width:430px){
  .sm-time-date-block{padding:10px}
  .sm-time-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* ===== v21: functional grouping for small buttons =====
   The administrator-selected small-button color remains the dominant/base group.
   Secondary functional groups use automatically-derived variants of that same color. */
.btn:not(.danger):not(.primary){
  background:var(--small-button-bg-soft,var(--small-button-bg,var(--primary)))!important;
  border-color:var(--small-button-bg-soft,var(--small-button-bg,var(--primary)))!important;
}
.tc-month-head button:not(.danger),
.availability-calendar-header .btn:not(.danger){
  background:var(--small-button-bg-light,var(--small-button-bg,var(--primary)))!important;
  border-color:var(--small-button-bg-light,var(--small-button-bg,var(--primary)))!important;
}
.tc-type:not(.danger){
  background:var(--small-button-bg-deep,var(--small-button-bg,var(--primary)))!important;
  border-color:var(--small-button-bg-deep,var(--small-button-bg,var(--primary)))!important;
}
.chip:not(.danger){
  background:var(--small-button-bg-muted,var(--small-button-bg,var(--primary)))!important;
  border-color:var(--small-button-bg-muted,var(--small-button-bg,var(--primary)))!important;
}
/* High-frequency time controls and primary actions keep the exact administrator-selected base color. */
.tc-time-btn:not(.danger),
.time-slot:not(.danger),
.btn.primary:not(.danger){
  background:var(--small-button-bg,var(--primary))!important;
  border-color:var(--small-button-bg,var(--primary))!important;
}
/* Persistent selection stays visibly distinct on top of every functional shade. */
.tc-time-btn.sel,
.tc-type.sel,
.chip.on,
.time-slot.on,
.tc-day.sel,
.availability-day.selected,
.aggregate-day.selected{
  filter:brightness(.76) saturate(1.18)!important;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.66),0 2px 8px rgba(23,27,45,.20)!important;
}


/* ===== v23: pinned notes / D-day poster calendar / monthly schedule types ===== */
.fixed-notes{margin:0 0 6px;padding:0 2px 4px;border-bottom:1px solid var(--line)}

<!-- ===== Firebase shared database configuration =====
  1) Firebase Console > Project settings > Your apps > Web app에서 firebaseConfig 값을 복사합니다.
  2) 아래 PASTE_... 값을 실제 값으로 교체하세요.
  3) Authentication > Sign-in method > Anonymous 를 활성화하세요.
  4) Firestore Database를 생성하고 안내된 보안 규칙을 적용하세요.
-->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAg35-YGDPxl8pvPDY3snQteDFWQSlPtJI",
  authDomain: "theater-schedule-89f26.firebaseapp.com",
  projectId: "theater-schedule-89f26",
  storageBucket: "theater-schedule-89f26.firebasestorage.app",
  messagingSenderId: "286330395772",
  appId: "1:286330395772:web:c9b08b49b0e28fd2103df9"
};

const configured = !Object.values(firebaseConfig).some(v => String(v).includes("PASTE_"));
window.TCFirebase = { configured, ready:false, status: configured ? "connecting" : "not-configured" };

if(configured){
  try{
    const fbApp = initializeApp(firebaseConfig);
    const auth = getAuth(fbApp);
    const db = getFirestore(fbApp);
    const sharedRef = doc(db, "theaterClown", "shared");
    let applyingRemote = false;

    window.TCFirebase.save = async (payload)=>{
      if(!window.TCFirebase.ready || applyingRemote){
        window.__TC_PENDING_CLOUD_STATE = payload;
        return;
      }
      const clean = JSON.parse(JSON.stringify(payload || {}));
      clean._cloudMeta = { updatedAt: serverTimestamp() };
      await setDoc(sharedRef, clean, { merge:false });
    };

    async function startCloud(user){
      if(!user) return;
      window.TCFirebase.ready = true;
      window.TCFirebase.status = "connected";

      const initial = await getDoc(sharedRef);
      if(!initial.exists()){
        const seed = window.__TC_getCloudPayload ? window.__TC_getCloudPayload() : {};
        await window.TCFirebase.save(seed);
      }

      onSnapshot(sharedRef, snap=>{
        if(!snap.exists()) return;
        const data = snap.data() || {};
        delete data._cloudMeta;
        applyingRemote = true;
        try{ window.__TC_applyCloudState && window.__TC_applyCloudState(data); }
        finally{ applyingRemote = false; }
      }, err=>{
        console.error("Firestore listener error", err);
        window.TCFirebase.status = "error";
      });

      if(window.__TC_PENDING_CLOUD_STATE){
        const pending = window.__TC_PENDING_CLOUD_STATE;
        window.__TC_PENDING_CLOUD_STATE = null;
        await window.TCFirebase.save(pending);
      }
    }

    onAuthStateChanged(auth, user=>{
      if(user) startCloud(user).catch(console.error);
      else signInAnonymously(auth).catch(err=>{
        console.error("Anonymous Firebase sign-in failed", err);
        window.TCFirebase.status = "auth-error";
      });
    });
  }catch(err){
    console.error("Firebase initialization failed", err);
    window.TCFirebase.status = "error";
  }
}
</script>

  const hasRange=chunks.some(x=>/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/.test(x));

    const mins=chunks.map(getTimeMinutes).filter(Number.isFinite).sort((a,b)=>a-b);

function getScheduleIntervals(text){
  const out=[];
  const re=/(\d{1,2}:\d{2})\s*[-–~]\s*(\d{1,2}:\d{2})/g; let m;
  while((m=re.exec(String(text||'')))){const a=getTimeMinutes(m[1]),b=getTimeMinutes(m[2]);if(Number.isFinite(a)&&Number.isFinite(b)&&b>=a)out.push({start:a,end:b});}

function parseTimeIntervals(text){
  const raw=String(text||'');
  const explicit=[];
  const rangeRe=/(\d{1,2}:\d{2})\s*[-–~]\s*(\d{1,2}:\d{2})/g;
  let m;
  while((m=rangeRe.exec(raw))){
    const a=getTimeMinutes(m[1]),b=getTimeMinutes(m[2]);
    if(Number.isFinite(a)&&Number.isFinite(b)&&b>a) explicit.push({start:a,end:b});
  }
  if(explicit.length) return explicit.sort((a,b)=>a.start-b.start);

  // 구버전 저장 데이터는 "20:00, 21:00, 22:00, 23:00"처럼
  // 선택한 시각의 목록으로 남아 있다. 두 개씩 짝짓지 않고 실제 연속 구간으로 복원한다.
  const points=[...new Set((raw.match(/\d{1,2}:\d{2}/g)||[]).map(getTimeMinutes).filter(Number.isFinite))].sort((a,b)=>a-b);
  if(!points.length) return [];
  if(points.length===1) return [{start:points[0],end:Math.min(points[0]+30,1440)}];
  const diffs=[];
  for(let i=1;i<points.length;i++){const d=points[i]-points[i-1];if(d>0&&d<=60)diffs.push(d);}
  const step=diffs.length?Math.min(...diffs):30;
  const intervals=[];
  let start=points[0],prev=points[0];
  for(let i=1;i<points.length;i++){
    if(points[i]-prev>step){if(prev>start)intervals.push({start,end:prev});else intervals.push({start,end:Math.min(start+step,1440)});start=points[i];}
    prev=points[i];
  }
  if(prev>start)intervals.push({start,end:prev});else intervals.push({start,end:Math.min(start+step,1440)});
  return intervals.filter(r=>r.end>r.start).sort((a,b)=>a.start-b.start);
}
function intervalsOverlap(a,b){
  return !!a&&!!b&&a.start<b.end&&b.start<a.end;

function commonIntervalsForDate(date,people){
  const raw=Array.isArray(state.availability?.[date])?state.availability[date]:(state.availability?.[date]?[state.availability[date]]:[]);

  // 같은 팀원이 중복 저장되어 있어도 한 사람으로만 계산한다.
  const byMember=new Map();
  raw.forEach(v=>{if(v&&v.member&&parseTimeIntervals(v.time).length)byMember.set(v.member,v);});
  const registered=[...byMember.values()];
  const totalRegistered=registered.length;
  if(!totalRegistered) return {count:0,total:0,ranges:[],ok:false,display:""};

  const selectedNames=Array.isArray(people)?people:[];
  const target=selectedNames.length?registered.filter(v=>selectedNames.includes(v.member)):registered;
  if(!target.length) return {count:0,total:totalRegistered,ranges:[],ok:false,display:""};

  // 한 명만 계산할 때는 30분 슬롯으로 다시 쪼개지 않고 실제 등록 구간을 그대로 표시한다.
  if(target.length===1){
    const rs=parseTimeIntervals(target[0].time).slice().sort((a,b)=>a.start-b.start);
    const merged=[];
    rs.forEach(r=>{
      const last=merged[merged.length-1];
      if(last&&r.start<=last.end)last.end=Math.max(last.end,r.end);
      else merged.push({start:r.start,end:r.end});
    });
    const ranges=merged.map(r=>`${formatMin(r.start)}–${formatMin(r.end)}`);
    return {count:1,total:totalRegistered,ranges,ok:true,display:`1명/${totalRegistered}명 ${ranges.join(' / ')}`};
  }

  // 내부 계산은 30분 단위. 각 슬롯에서 실제 가능한 팀원 이름까지 보존한다.
  const parsed=target.map(person=>({member:person.member,ranges:parseTimeIntervals(person.time)}));
  const slots=[];
  for(let start=0;start<1440;start+=30){
    const end=start+30;
    const members=parsed.filter(p=>p.ranges.some(r=>r.start<=start&&r.end>=end)).map(p=>p.member).sort();
    if(members.length)slots.push({start,end,count:members.length,key:members.join('\u0001')});
  }
  if(!slots.length)return {count:0,total:totalRegistered,ranges:[],ok:false,display:`${totalRegistered}명`};

  const max=Math.max(...slots.map(x=>x.count));
  if(max<2)return {count:0,total:totalRegistered,ranges:[],ok:false,display:`${totalRegistered}명`};

  const best=slots.filter(x=>x.count===max);
  const groups=[];
  best.forEach(slot=>{
    const last=groups[groups.length-1];
    if(last&&last.end===slot.start&&last.key===slot.key)last.end=slot.end;
    else groups.push({start:slot.start,end:slot.end,key:slot.key});
  });

  // 최대 인원 그룹이 둘 이상이면 특정 시간을 임의 선택하지 않는다.
  if(groups.length>1){
    return {count:max,total:totalRegistered,ranges:[],ok:true,display:groups.map(()=>`${max}명`).join('·')+`/${totalRegistered}명`};
  }

  const range=`${formatMin(groups[0].start)}–${formatMin(groups[0].end)}`;
  return {count:max,total:totalRegistered,ranges:[range],ok:true,display:`${max}명/${totalRegistered}명 ${range}`};
}

function editPractice(i){
  const x=state.schedules[i]; if(!x)return; const host=document.querySelector(`[data-schedule-index="${i}"]`); if(!host)return; host.querySelector('.tc-inline-edit')?.remove();
  const ed=document.createElement('div');ed.className='tc-inline-edit';

  const parsedExisting=parseTimeIntervals(x.time||'');
  parsedExisting.forEach(range=>{
    for(let m=range.start;m<=range.end;m+=step){
      const t=formatMin(m);

  });
  if(!selected.length){
    selected=[...new Set((String(x.time||'').match(/\d{1,2}:\d{2}/g)||[]))];
  }
  selected.sort((a,b)=>getTimeMinutes(a)-getTimeMinutes(b));

  // 기존 시간이 있으면 개별 토글 모드로 시작한다.
  // 모든 시간을 해제한 뒤에는 첫 클릭=시작, 두 번째 클릭=끝으로 범위를 자동 선택한다.
  let anchor=null;
  let rangePickMode=selected.length===0;

  ed.innerHTML=`<div class="field"><label>날짜</label><input type="date" id="ieDate" value="${x.date}"></div><div class="field"><label>시간</label><div class="people" style="margin-bottom:8px">기존 시간은 범위 전체가 선택됩니다. 선택된 시간은 다시 누르면 해제되고, 모두 해제된 뒤에는 시작 시간과 끝 시간을 차례로 누르면 사이 시간이 자동 선택됩니다.</div><div class="tc-time-grid" id="ieTimes"></div></div><div class="field"><label>일정 종류</label><div class="tc-types" id="ieTypes">${['연습','공연','셋업','기타'].map(t=>`<button type="button" class="tc-type ${x.type===t?'sel':''}" data-t="${t}">${t}</button>`).join('')}</div></div><div class="field"><label>참여팀원</label><div class="chips" id="iePeople">${state.members.map(m=>`<button type="button" class="chip ${Array.isArray(x.people)&&x.people.includes(m.name)?'on':''}" data-name="${m.name}">${m.name}</button>`).join('')}</div></div><div class="field"><label>메모 / 연습내용</label><textarea id="ieMemo" placeholder="내용을 입력하세요">${x.memo||''}</textarea></div><div class="tc-actions"><button class="btn danger" id="ieCancel">취소</button><button class="btn primary" id="ieSave">저장</button></div>`;
  host.appendChild(ed);

  function draw(){
    ed.querySelector('#ieTimes').innerHTML=Array.from({length:Math.floor(1440/step)+1},(_,j)=>{
      const t=formatMin(j*step);
      return `<button type="button" class="tc-time-btn ${selected.includes(t)?'sel':''}" data-v="${t}">${timeOptionLabel(t)}</button>`;
    }).join('');

    ed.querySelectorAll('#ieTimes [data-v]').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v;
      const isSelected=selected.includes(v);

      if(rangePickMode){
        // 모든 시간이 비어 있는 상태: 1회차는 시작점, 2회차는 끝점.
        if(anchor===null){
          selected=[v];
          anchor=v;
        }else if(v===anchor){
          // 시작점을 다시 누르면 선택 취소 후 처음부터 다시 시작.

        if(isSelected){
          selected=selected.filter(t=>t!==v);
        }else{
          selected.push(v);
          selected.sort((a,b)=>getTimeMinutes(a)-getTimeMinutes(b));
        }

        // 마지막 선택까지 모두 해제되면 다음 클릭부터 다시 시작/끝 범위 선택 모드.
        if(!selected.length){
          anchor=null;
          rangePickMode=true;
        }
      }

      draw();
    });
  }

  ed.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ed.querySelectorAll('[data-t]').forEach(z=>z.classList.remove('sel'));b.classList.add('sel')});ed.querySelectorAll('#iePeople .chip').forEach(b=>b.onclick=()=>b.classList.toggle('on'));ed.querySelector('#ieCancel').onclick=()=>ed.remove();ed.querySelector('#ieSave').onclick=()=>{const date=ed.querySelector('#ieDate').value;if(!date||!selected.length)return alert('날짜와 시간을 선택해주세요.');x.date=date;x.time=compressTimes(selected).join(' / ');x.type=ed.querySelector('#ieTypes .sel')?.dataset.t||x.type;x.title=x.type;x.people=[...ed.querySelectorAll('#iePeople .chip.on')].map(b=>b.dataset.name);x.memo=ed.querySelector('#ieMemo').value.trim();scheduleId(x);x._syncSnapshot={};x.people.forEach(n=>{const e=getAvailabilityEntry(n,x.date);x._syncSnapshot[n]=e?.time||null;});save();render()};draw();
}

function mergeAvailabilityText(text){

  const points=new Set();
  tokens.forEach(v=>{const q=v.match(/(\d{1,2}:\d{2})(?:\s*[-–~]\s*(\d{1,2}:\d{2}))?/);if(!q)return;const a=getTimeMinutes(q[1]),b=q[2]?getTimeMinutes(q[2]):a;if(!Number.isFinite(a)||!Number.isFinite(b))return;for(let m=Math.min(a,b);m<=Math.max(a,b);m+=30)points.add(formatMin(m));});

function compressTimes(times){const mins=[...new Set(times.map(getTimeMinutes).filter(Number.isFinite))].sort((a,b)=>a-b);if(!mins.length)return[];let out=[],start=mins[0],prev=mins[0];let step=60;for(let i=1;i<mins.length;i++){const diff=mins[i]-prev;if(diff>0&&diff<step)step=diff; if(diff>step){out.push(start===prev?formatMin(start):`${formatMin(start)}-${formatMin(prev)}`);start=mins[i];}prev=mins[i];}out.push(start===prev?formatMin(start):`${formatMin(start)}-${formatMin(prev)}`);return out;}

function renderAvailabilityTimes(){

  const area=
    document.getElementById(
      "availabilityTimeArea"
    );


  if(!area)return;


  let html="";


  const step=
    availabilityHalfHour
      ? 30
      : 60;


  for(
    let h=0;
    h<24;
    h++
  ){

    for(
      let m=0;
      m<60;
      m+=step
    ){

      const time=
        `${String(h).padStart(2,"0")}:`+
        `${String(m).padStart(2,"0")}`;


      const selected=
        selectedAvailabilityTimes
          .includes(time);


      const rangeStart=
        availabilityRangeStart===time;


      html+=`

        <button
          type="button"
          class="time-slot
            ${selected?"on":""}
            ${rangeStart?"range-start":""}"
          onclick="toggleAvailabilityTime('${time}')">

          ${time}

        </button>

      `;

    }

  }


  const endTime="24:00";
  html+=`<button type="button" class="time-slot ${selectedAvailabilityTimes.includes(endTime)?"on":""} ${availabilityRangeStart===endTime?"range-start":""}" onclick="toggleAvailabilityTime('${endTime}')">00:00</button>`;

/* =========================================================
   시간 선택
   ========================================================= */

function toggleAvailabilityTime(time){

  if(
    availabilityRangeStart===null
  ){

    availabilityRangeStart=time;

    renderAvailabilityTimes();

    return;

  }


  const startMinutes=
    availabilityTimeToMinutes(
      availabilityRangeStart
    );


  const endMinutes=
    availabilityTimeToMinutes(time);


  const from=
    Math.min(
      startMinutes,
      endMinutes
    );


  const to=
    Math.max(
      startMinutes,
      endMinutes
    );


  const step=
    availabilityHalfHour
      ? 30
      : 60;


  const range=[];


  for(
    let t=from;
    t<=to;
    t+=step
  ){

    range.push(
      availabilityMinutesToTime(t)
    );

  }


  selectedAvailabilityTimes=
    [
      ...new Set([
        ...selectedAvailabilityTimes,
        ...range
      ])
    ];


  selectedAvailabilityTimes.sort();


  availabilityRangeStart=null;


  renderAvailabilityTimes();

}


/* =========================================================
   시간 → 분
   ========================================================= */

function availabilityTimeToMinutes(time){

  const parts=
    time.split(":");


  return(
    Number(parts[0])*60+
    Number(parts[1])
  );

}


/* =========================================================
   분 → 시간
   ========================================================= */

function availabilityMinutesToTime(minutes){

  const h=
    Math.floor(minutes/60);


  const m=
    minutes%60;


  return(
    `${String(h).padStart(2,"0")}:`+
    `${String(m).padStart(2,"0")}`
  );

}

/* =========================================================

   ========================================================= */

function getMemberAvailability(member){

  const result={};


  Object.entries(
    state.availability||{}
  ).forEach(([date,value])=>{

    /*
     * 새 데이터 구조
     */
    if(Array.isArray(value)){

      const found=
        value.find(
          x=>x.member===member
        );


      if(found){

        result[date]=found;

      }

      return;

    }


    /*
     * 예전 데이터 구조와 호환
     */
    if(
      value &&
      value.member===member
    ){

      result[date]=value;

    }

  });


  return result;

}

   ========================================================= */

function saveAvailability(){

  const member=
    document.getElementById(
      "availabilityMember"
    )?.value || "";


  if(!member){

    alert(
      "이름을 먼저 선택해주세요."
    );

    return;

  }


  if(!selectedAvailabilityDates.length){

    alert(
      "날짜를 하나 이상 선택해주세요."
    );

    return;

  }


  if(!selectedAvailabilityTimes.length){

    alert(
      "가능한 시간을 하나 이상 선택해주세요."
    );

    return;

  }


  const memo=
    document.getElementById(
      "memo"
    )?.value.trim() || "";


  const time=
    selectedAvailabilityTimes
      .slice()
      .sort()
      .join(", ");


  if(!state.availability){

    state.availability={};

  }


  selectedAvailabilityDates.forEach(date=>{

    /*
     * 기존 구조가 배열이 아니면
     * 새 구조로 변환
     */
    if(
      !Array.isArray(
        state.availability[date]
      )
    ){

      const old=
        state.availability[date];


      state.availability[date]=
        old
        ? [old]
        : [];

    }


    const list=
      state.availability[date];


    const existing=
      list.find(
        x=>x.member===member
      );


    if(existing){

      existing.time=mergeAvailabilityText(`${existing.time||""} / ${time}`);

      existing.memo=memo||existing.memo||"";

    }else{

      list.push({

        member:member,

        time:mergeAvailabilityText(time),

        memo:memo

      });

    }

  });

  selectedAvailabilityDates.forEach(date=>syncConfirmedSchedulesForDate(date,member));

  save();


  alert(
    `${selectedAvailabilityDates.length}개 날짜의 가능 시간이 저장되었습니다.`
  );


  selectedAvailabilityDates=[];

  selectedAvailabilityTimes=[];

  availabilityRangeStart=null;


  render();

  selectAvailabilityMember(member);
}


/* =========================================================
   가능시간 삭제
   ========================================================= */

function deleteAvailability(date,member){

  if(
    !confirm(
      `${date}의 가능시간을 삭제할까요?`
    )
  ){

    return;

  }


  const value=
    state.availability?.[date];


  if(Array.isArray(value)){

    state.availability[date]=
      value.filter(
        x=>x.member!==member
      );


    if(
      state.availability[date].length===0
    ){

      delete state.availability[date];

    }

  }else{

    if(
      value &&
      value.member===member
    ){

/* =========================================================
   실제 공통 가능시간 계산
   ========================================================= */

function findCommonAvailability(members){

  const result={};


  Object.keys(
    state.availability||{}
  ).forEach(date=>{

    const value=
      state.availability[date];


    let list=[];


    if(Array.isArray(value)){

      list=value;

    }else if(value){

      list=[value];

    }


    const memberData=
      members.map(member=>
        list.find(
          x=>x.member===member
        )
      );


    if(
      memberData.some(
        x=>!x
      )
    ){

      return;

    }


    const common=
      getCommonTimeSlots(
        memberData.map(
          x=>x.time
        )
      );


    if(common.length){

      result[date]=common;

    }

  });


  return result;

}


/* =========================================================
   공통 시간 계산
   ========================================================= */

function getCommonTimeSlots(timeLists){

  if(!timeLists.length)return[];


  const sets=
    timeLists.map(text=>{

      return new Set(
        String(text)
          .split(",")
          .map(x=>x.trim())
          .filter(Boolean)
      );

    });


  const first=
    [...sets[0]];


  return first.filter(
    time=>
      sets.every(
        set=>set.has(time)
      )
  );

}

      <div class="field design-cell"><label>안내 아이콘 글씨색</label>${swVivid('thBadgeText',t.badgeText||'#ffffff')}</div>
    </div>
    <div class="design-row">
      <div class="field design-cell"><label>D-day 배너 배경색</label>${swDday('thDdayBg',t.ddayBg||'#273b57')}</div>
      <div class="field design-cell"><label>D-day 배너 포인트색</label>${swDday('thDdayText',t.ddayText||'#e0a36c')}</div>
    </div>
    <div class="design-row">
      <div class="field design-cell"><label>D-day 글씨체</label>
        <select id="thDdayFont">
          <option value="original" ${(t.ddayFont||'original')==='original'?'selected':''}>1. 기존 필기체</option>
          <option value="hand" ${(t.ddayFont||'original')==='hand'?'selected':''}>2. 한글 손글씨체</option>
          <option value="neat" ${(t.ddayFont||'original')==='neat'?'selected':''}>3. 단정한 글씨체</option>
          <option value="base" ${(t.ddayFont||'original')==='base'?'selected':''}>4. 기본 페이지 글씨체</option>
          <option value="elegant" ${(t.ddayFont||'original')==='elegant'?'selected':''}>5. 우아한 세리프체</option>
        </select>
      </div>
      <div class="field design-cell"><label>D-day 포인트 모양</label>
        <select id="thDdayMarkShape">
          <option value="circle" ${(t.ddayMarkShape||'circle')==='circle'?'selected':''}>동그라미</option>
          <option value="heart" ${(t.ddayMarkShape||'circle')==='heart'?'selected':''}>하트</option>
          <option value="star" ${(t.ddayMarkShape||'circle')==='star'?'selected':''}>별무늬</option>
          <option value="rounded" ${(t.ddayMarkShape||'circle')==='rounded'?'selected':''}>둥근 사각형</option>
        </select>
      </div>
    </div>
  </div>
  <div class="design-actions">
    <button class="btn" onclick="setThemeMode('light')">화이트모드</button>
    <button class="btn" onclick="setThemeMode('dark')">다크모드</button>
    <button class="btn primary" onclick="saveTheme()">디자인 저장</button>
  </div>
</div>
  <div class="card"><div class="section-title"><h3>👥 팀원 관리</h3><button class="btn primary" onclick="addMember()">+ 팀원 추가</button></div>${state.members.length?`<div class="member-grid admin-member-grid">${state.members.map((m,i)=>`<div class="member-grid-item"><b>${m.name}</b><div class="people">${m.pos}</div><div class="member-cell-actions"><button class="btn" onclick="editMember(${i})">수정</button><button class="btn danger" onclick="deleteMember(${i})">삭제</button></div></div>`).join('')}</div>`:`<div class="empty">등록된 팀원이 없습니다.</div>`}</div>
  ${state.role==="security"?securityOnlyAdminCards():""}`;
}
function formatVisitTime(value){
  if(!value)return "-";
  const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value);
  return d.toLocaleString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function roleLabel(role){return role==="security"?"보안자":role==="admin"?"관리자":"일반";}
function accessLogPanel(){
  const logs=Object.values(state.accessLogs||{}).sort((a,b)=>String(b.lastAt||"").localeCompare(String(a.lastAt||"")));
  if(!logs.length)return `<div class="card"><h3>🧾 접속 기록</h3><div class="empty">아직 기록된 접속이 없습니다.</div></div>`;
  return `<div class="card"><div class="section-title"><h3>🧾 접속 기록</h3><span class="pill">보안자 전용</span></div><p class="muted small">로그인 성공 횟수와 브라우저별 기기 기록입니다. 같은 종류의 기기도 기기 번호로 구분합니다.</p>${logs.map(r=>{const devices=Object.values(r.devices||{}).sort((a,b)=>(Number(a.deviceNo)||9999)-(Number(b.deviceNo)||9999)||String(a.firstAt||"").localeCompare(String(b.firstAt||"")));devices.forEach((d,index)=>{if(!d.deviceNo)d.deviceNo=index+1;});return `<details class="schedule-item"><summary style="cursor:pointer"><b>${roleLabel(r.role)} · ${String(r.name||"").replace(/</g,"&lt;")}-${r.totalVisits||0}회</b><div class="people">최근 ${formatVisitTime(r.lastAt)} · 기기 ${devices.length}개</div></summary><div style="margin-top:9px" class="small"><div>최초 방문: ${formatVisitTime(r.firstAt)}</div>${devices.map(d=>`<div style="margin-top:7px;padding:8px;border:1px solid var(--line);border-radius:10px"><b>${String(d.label||"기기").replace(/</g,"&lt;")} · 기기 ${d.deviceNo}</b> · ${d.visits||0}회<br><span class="muted">최초 ${formatVisitTime(d.firstAt)} / 최근 ${formatVisitTime(d.lastAt)}</span></div>`).join("")}</div></details>`;}).join("")}</div>`;
}
function securityOnlyAdminCards(){
  return `<div class="card"><div class="section-title"><h3>🔑 입장 코드 관리</h3><span class="pill">보안자 전용</span></div><div class="field"><label>기본 입장 코드</label><input id="newEntryCode" type="password" value="${state.entryCode}"></div><div class="field"><label>관리자 입장 코드</label><input id="newAdminCode" type="password" value="${state.adminCode}"></div><div class="field"><label>보안자 입장 코드</label><input id="newSecurityCode" type="password" value="${state.securityCode}"></div><button class="btn primary" onclick="saveCodes()">입장 코드 저장</button></div>${accessLogPanel()}<div class="card"><div class="section-title"><h3>⚠️ 새 공연 시작 / 초기화</h3><span class="pill">보안자 전용</span></div><p class="muted">연습일정, 스케줄 조율, 공지/자료, 공연/극장일정, 팀원 정보, 접속기록을 초기화합니다. 입장코드는 유지합니다.</p><button class="btn danger" onclick="resetShow()">공연 데이터 초기화</button></div>`;
}
function saveTheme(){const t=state.theme||{};const pick=id=>document.querySelector(`#${id} .swatch.sel`)?.dataset.c;t.bg=pick('thBg')||t.bg||'#f5f6fa';t.card=pick('thCard')||t.card||'#ffffff';t.bottomMenuBg=pick('thBottomMenuBg')||t.bottomMenuBg||t.card||'#ffffff';t.bottomMenuText=pick('thBottomMenuText')||t.bottomMenuText||t.primary||'#6657e8';t.largeButtonBg=pick('thLargeButtonBg')||t.largeButtonBg||t.primary||'#6657e8';t.largeButtonText=pick('thLargeButtonText')||t.largeButtonText||t.buttonText||'#ffffff';t.smallButtonBg=pick('thSmallButtonBg')||t.smallButtonBg||t.primary||'#6657e8';t.smallButtonText=pick('thSmallButtonText')||t.smallButtonText||t.buttonText||'#ffffff';t.primary=t.smallButtonBg;t.buttonText=t.smallButtonText;t.ddayBg=pick('thDdayBg')||t.ddayBg||'#171b2d';t.ddayText=pick('thDdayText')||t.ddayText||'#ffffff';t.ddayFont=document.getElementById('thDdayFont')?.value||t.ddayFont||'original';t.ddayMarkShape=document.getElementById('thDdayMarkShape')?.value||t.ddayMarkShape||'circle';t.badgeBg=pick('thBadgeBg')||t.badgeBg||t.smallButtonBg||'#6657e8';t.badgeText=pick('thBadgeText')||t.badgeText||'#ffffff';state.theme=t;save();applyTheme();alert('디자인 설정이 저장되었습니다.');render();}
function setThemeMode(mode){state.theme=state.theme||{};const keep={ddayFont:state.theme.ddayFont||'original',ddayMarkShape:state.theme.ddayMarkShape||'circle'};state.theme.mode=mode;if(mode==='dark'){Object.assign(state.theme,{bg:'#171b2d',card:'#252a40',ink:'#ffffff',primary:'#7c70ff',buttonText:'#ffffff',bottomMenuBg:'#252a40',bottomMenuText:'#ffffff',largeButtonBg:'#7c70ff',largeButtonText:'#ffffff',smallButtonBg:'#7c70ff',smallButtonText:'#ffffff',badgeBg:'#7c70ff',badgeText:'#ffffff',ddayBg:'#171b2d',ddayText:'#d77b8c'});}else{Object.assign(state.theme,{bg:'#f5f6fa',card:'#ffffff',ink:'#171b2d',primary:'#6657e8',buttonText:'#ffffff',bottomMenuBg:'#ffffff',bottomMenuText:'#6657e8',largeButtonBg:'#6657e8',largeButtonText:'#ffffff',smallButtonBg:'#6657e8',smallButtonText:'#ffffff',badgeBg:'#6657e8',badgeText:'#ffffff',ddayBg:'#fffaf3',ddayText:'#a63a42'});}Object.assign(state.theme,keep);save();applyTheme();render();}
function openShowDatesModal(){
  const existing=getShowDates();const map={};existing.forEach(x=>map[x.date]=x.time||'19:00');let dates=Object.keys(map);let view=new Date();view.setDate(1);const bg=document.createElement('div');bg.className='tc-modal-bg';bg.innerHTML=`<div class="tc-modal"><h3>공연 날짜/시간 설정</h3><div id="sdCal"></div><div id="sdTimes" style="margin-top:12px"></div><div class="tc-actions"><button class="btn danger" id="sdCancel">취소</button><button class="btn primary" id="sdSave">저장</button></div></div>`;document.body.appendChild(bg);const pad=n=>String(n).padStart(2,'0');let times={...map};function renderCal(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);let h=`<div class="tc-month-head"><button id="sdPrev">◀</button><b>${y}년 ${m+1}월</b><button id="sdNext">▶</button></div><div class="tc-week">${['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')}</div><div class="tc-days">`;for(let i=0;i<first.getDay();i++)h+='<button class="tc-day empty"></button>';for(let d=1;d<=last.getDate();d++){const v=`${y}-${pad(m+1)}-${pad(d)}`;h+=`<button type="button" class="tc-day ${dates.includes(v)?'sel':''}" data-date="${v}">${d}</button>`;}bg.querySelector('#sdCal').innerHTML=h+'</div>';bg.querySelectorAll('#sdCal [data-date]').forEach(b=>b.onclick=()=>{const v=b.dataset.date;if(dates.includes(v)){dates=dates.filter(x=>x!==v);delete times[v];}else{dates.push(v);times[v]='19:00';}renderCal();renderTimes();});bg.querySelector('#sdPrev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};bg.querySelector('#sdNext').onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};}
  function renderTimes(){const list=dates.slice().sort();bg.querySelector('#sdTimes').innerHTML=list.length?`<div class="field"><label>선택한 날짜별 공연 시간</label>${list.map(v=>`<div class="field"><label>${v}</label><input class="sd-time" data-date="${v}" type="time" value="${times[v]||'19:00'}"></div>`).join('')}</div>`:`<div class="empty">날짜를 선택해주세요.</div>`;}
  bg.querySelector('#sdCancel').onclick=()=>bg.remove();bg.querySelector('#sdSave').onclick=()=>{bg.querySelectorAll('.sd-time').forEach(i=>times[i.dataset.date]=i.value);const out=dates.slice().sort().map(date=>({date,time:times[date]||'19:00'}));state.showDates=out;state.showDate=out[0]?.date||state.showDate;state.showTime=out[0]?.time||state.showTime;save();bg.remove();render()};renderCal();renderTimes();
}
function saveShowInfo(){state.showName=document.getElementById('showName').value.trim()||state.showName;state.bannerSmallName=document.getElementById('bannerSmallName').value.trim();state.loginTitle=document.getElementById('loginTitle').value.replace(/\r\n/g,'\n').trim()||'THEATER CLOWN';state.loginTitleFont=document.getElementById('loginTitleFont')?.value||state.loginTitleFont||'bold';state.loginSubtitle=document.getElementById('loginSubtitle').value.trim()||'공연팀 일정 · 공지 · 자료 관리';save();alert('정보가 저장되었습니다.');render()}
function memberModal(initial,onSave){const x=initial||{name:'',pos:'배우'};const bg=document.createElement('div');bg.className='tc-modal-bg';bg.innerHTML=`<div class="tc-modal"><h3>${initial?'팀원 수정':'팀원 추가'}</h3><div class="field"><label>이름</label><input id="mmName" value="${x.name||''}"></div><div class="field"><label>포지션</label><input id="mmPos" value="${x.pos||'배우'}"></div><div class="tc-actions"><button class="btn danger" id="mmCancel">취소</button><button class="btn primary" id="mmSave">저장</button></div></div>`;document.body.appendChild(bg);bg.querySelector('#mmCancel').onclick=()=>bg.remove();bg.querySelector('#mmSave').onclick=()=>{const name=bg.querySelector('#mmName').value.trim(),pos=bg.querySelector('#mmPos').value.trim();if(!name)return alert('이름을 입력해주세요.');onSave({name,pos:pos||'배우'});bg.remove();save();render()}}
function addMember(){memberModal(null,x=>state.members.push({...x,joined:true}))}
function editMember(i){memberModal(state.members[i],x=>Object.assign(state.members[i],x))}
function deleteMember(i){
  if(confirm(`${state.members[i].name} 팀원을 삭제할까요?`)){
    state.members.splice(i,1);save();render();
  }
}
function saveCodes(){
  if(state.role!=="security"){alert("보안자만 입장 코드를 변경할 수 있습니다.");return;}
  const entry=document.getElementById("newEntryCode").value.trim();
  const admin=document.getElementById("newAdminCode").value.trim();
  const security=document.getElementById("newSecurityCode").value.trim();
  if(!entry||!admin||!security){alert("세 코드를 모두 입력해주세요.");return;}
  if(new Set([entry,admin,security]).size!==3){alert("일반, 관리자, 보안자 코드는 서로 다르게 설정해주세요.");return;}
  state.entryCode=entry;
  state.adminCode=admin;
  state.securityCode=security;
  save();
  alert("입장 코드가 저장되었습니다. 다음 입장부터 적용됩니다.");
  render();
}
function resetShow(){
  if(state.role!=="security"){alert("보안자만 공연 데이터를 초기화할 수 있습니다.");return;}
  if(confirm("정말 공연 데이터를 초기화할까요?")){
    state.schedules=[];
    state.stage=[];
    state.notices=[];
    state.showDates=[];
    state.showDate="";
    state.showTime="";
    state.venue="";
    state.members=[];
    state.availability={};
    state.aggregateMembers=[];
    state.confirmDates=[];
    state.confirmTimesByDate={};
    state.confirmPeople=[];
    state.confirmManualPeople=[];
    state.confirmExcludedPeople=[];
    state.confirmMemo="";
    state.accessLogs={};
    state._ddayEdit=null;
    save();
    applyTheme();
    render();
    alert("공연 데이터와 접속 기록이 초기화되었습니다. D-day는 END로 표시됩니다.");
  }
}

app();
</script>
</body>
</html>

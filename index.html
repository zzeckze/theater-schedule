<!doctype html>
<html lang="ko">  
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171b2d">
<title>THEATER-CLOWN · 공연팀 관리</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#171b2d;--muted:#73798c;--primary:#6657e8;--accent:#ff6b8a;--line:#e7e8ef;--danger:#e84b5f;--ok:#20a36a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
#app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg)}
header{position:sticky;top:0;z-index:20;background:rgba(245,246,250,.95);backdrop-filter:blur(12px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between}.brand b{font-size:18px}.brand small{color:var(--muted)}
.toplinks{display:flex;gap:7px;overflow:auto;padding-top:12px}.toplinks button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:#444b60}
main{padding:14px 16px 100px}.hero{background:linear-gradient(135deg,#171b2d,#6657e8);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px}.hero .dday{font-size:42px;font-weight:800;line-height:1}.hero p{margin:8px 0 0;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0}.card h3{margin:0 0 12px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#f0efff;color:var(--primary);font-size:12px;font-weight:700}
.notice{padding:13px;border-radius:15px;background:#fff3f6;border:1px solid #ffd5df}.schedule-item{padding:13px 0;border-bottom:1px solid var(--line)}.schedule-item:last-child{border-bottom:0}.time{font-size:17px;font-weight:800}.people{font-size:13px;color:var(--muted);margin-top:5px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.bottom button{background:none;color:#74798a;font-size:11px;padding:5px 0}.bottom button.active{color:var(--primary);font-weight:800}.bottom span{display:block;font-size:20px;margin-bottom:2px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.section-title h2{font-size:20px;margin:0}.seg{display:flex;background:#ececf3;padding:3px;border-radius:12px;margin:10px 0}.seg button{flex:1;background:transparent;border-radius:9px;padding:8px;color:#666}.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 5px #00000012}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{text-align:center;font-size:11px;color:var(--muted);padding:4px}.day{min-height:70px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px}.day b{display:block}.dot{display:block;margin-top:5px;font-size:10px;color:var(--primary);font-weight:700}.dot.stage{color:#d77b1d}.dot.show{color:#e84b5f}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 13px;border-radius:12px;background:#f0efff;color:var(--primary);font-weight:700}.btn.primary{background:var(--primary);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:#555}.btn.danger{background:#fff0f2;color:var(--danger)}
.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px}.chip.on{background:#eeecff;border-color:#c9c3ff;color:var(--primary);font-weight:700}
.notice-list .card{margin-bottom:8px}.media{height:120px;border-radius:14px;background:#eef0f7;display:grid;place-items:center;color:#858b9b;margin-bottom:10px}
.login{min-height:100vh;display:grid;place-items:center;padding:28px 22px;background:linear-gradient(160deg,#171b2d 0%,#6657e8 70%,#ff6b8a 140%);color:#fff}.loginbox{width:100%;max-width:390px}.logo{font-size:34px;font-weight:900;letter-spacing:1px}.loginbox p{opacity:.75}.loginbtn{width:100%;padding:14px;border-radius:14px;margin:7px 0;font-weight:800}.codebtn{background:#fff;color:#171b2d}.fine{font-size:11px;opacity:.65;line-height:1.5;margin-top:14px;text-align:center}
.adminbar{background:#fff4d8;border:1px solid #ffe2a1;border-radius:15px;padding:11px 12px;margin:10px 0;color:#725314;font-size:13px}
.listline{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.listline:last-child{border-bottom:0}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.small{font-size:12px}
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.modal-card{
  width:min(500px,100%);
  max-height:85vh;
  overflow:auto;
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-sizing:border-box;
}

.time-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:15px;
}

.time-slot{
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  padding:10px 4px;
  cursor:pointer;
}

.time-slot.on{
  background:#171b2d;
  color:#fff;
  border-color:#171b2d;
}
  .availability-calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.availability-calendar{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
  width:100%;
}

.availability-calendar .calhead{
  min-width:0;
  text-align:center;
  padding:7px 0;
  font-size:12px;
  color:var(--muted);
}
  .availability-calendar-wrap{
  width:100%;
  background:#f8f8fc;
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
}

.availability-calendar-header .btn{
  min-width:40px;
  padding:8px 10px;
}

.availability-calendar-header b{
  font-size:16px;
}

.availability-day{
  width:100%;
  min-height:54px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 4px;
  font-size:13px;
  text-align:center;
  color:var(--ink);
  transition:.15s;
}

.availability-day:active{
  transform:scale(.96);
}

.availability-day.selected{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
  font-weight:800;
  box-shadow:0 3px 8px rgba(102,87,232,.25);
}

.availability-day.empty{
  background:transparent;
  border:0;
  pointer-events:none;
}

.availability-day.selected{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.availability-day.empty{
  background:transparent;
  border:0;
}

.time-slot.range-start{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DEFAULT_ENTRY_CODE="2026";
const DEFAULT_ADMIN_CODE="THEATER2026";

const state={
  logged:false,
  admin:false,
  tab:"home",
  view:"week",
  showName:"THEATER-CLOWN",
  venue:"문학씨어터",
  showDate:"2026-10-24",
  showTime:"19:00",
  entryCode:DEFAULT_ENTRY_CODE,
  adminCode:DEFAULT_ADMIN_CODE,
  members:[
    {name:"김○○",pos:"배우",joined:true},
    {name:"이○○",pos:"배우",joined:true},
    {name:"박○○",pos:"연출",joined:true}
  ],
  schedules:[
    {date:"2026-10-20",time:"19:00–22:00",title:"장면연습",people:["김○○","이○○"]},
    {date:"2026-10-22",time:"18:00–21:00",title:"전체연습",people:["김○○","이○○","박○○"]},
    {date:"2026-10-23",time:"19:00–21:00",title:"리허설",people:["김○○","이○○","박○○"]}
  ],
  stage:[
    {date:"2026-10-23",time:"13:00–21:00",title:"극장 입성 · 셋업 · 리허설"},
    {date:"2026-10-24",time:"19:00",title:"공연"}
  ],
  notices:[
    {type:"일반공지",title:"10/20 연습실 변경 안내",text:"20일 연습은 B연습실에서 진행합니다.",author:"관리자",special:true},
    {type:"공연음악",title:"공연음악 01",text:"최종 음원 업로드",author:"관리자",special:false},
    {type:"연습영상",title:"10/22 장면 영상",text:"연습 참고용 영상입니다.",author:"관리자",special:false},
    {type:"연습이미지",title:"무대 동선 사진",text:"연습 참고용 이미지입니다.",author:"관리자",special:false}
  ],
  availability:{}
};

function save(){
  localStorage.setItem("theaterClown",JSON.stringify(state));
}
function load(){
  try{
    const saved=JSON.parse(localStorage.getItem("theaterClown")||"null");
    if(saved){
      Object.assign(state,saved);
      state.logged=false;
      state.admin=false;
      state.tab="home";
      state.entryCode=state.entryCode||DEFAULT_ENTRY_CODE;
      state.adminCode=state.adminCode||DEFAULT_ADMIN_CODE;
    }
  }catch(e){}
}
load();

function app(){
  if(!state.logged) return login();
  document.getElementById("app").innerHTML=`
    <header>
      <div class="brand">
        <div><b>🎭 ${state.showName}</b><br><small>${state.venue}</small></div>
        <span class="pill">${state.admin?"관리자":"방문자"}</span>
      </div>
      <div class="toplinks">
        <button onclick="go('calendar')">📅 주요 일정</button>
        <button onclick="go('notice')">🚨 공지 & 자료</button>
        <button onclick="go('schedule')">🗓️ 스케줄 조율</button>
        ${state.admin?'<button onclick="go(\'admin\')">👑 관리자</button>':''}
      </div>
    </header>
    <main id="main"></main>
    <nav class="bottom">
      <button onclick="go('home')" class="${state.tab==='home'?'active':''}"><span>⌂</span>홈</button>
      <button onclick="go('practice')" class="${state.tab==='practice'?'active':''}"><span>📅</span>연습일정</button>
      <button onclick="go('schedule')" class="${state.tab==='schedule'?'active':''}"><span>✓</span>조율</button>
      <button onclick="go('calendar')" class="${state.tab==='calendar'?'active':''}"><span>🗓</span>일정</button>
    </nav>`;
  render();
}

function login(){
  document.getElementById("app").innerHTML=`
    <section class="login">
      <div class="loginbox">
        <div class="logo">THEATER<br>CLOWN</div>
        <p>공연팀 일정 · 공지 · 자료 관리</p>
        <div class="card" style="margin-top:22px">
          <div class="field">
            <label>입장 코드</label>
            <input id="entryCodeInput" type="password" inputmode="text" autocomplete="off" placeholder="입장 코드를 입력하세요" onkeydown="if(event.key==='Enter')enterSite()">
          </div>
          <button class="loginbtn codebtn" onclick="enterSite()">입장하기</button>
        </div>
        <div class="fine">일반 입장 코드는 일반 방문자로, 관리자 코드는 관리자 화면으로 입장합니다.</div>
      </div>
    </section>`;
}

function enterSite(){
  const code=document.getElementById("entryCodeInput").value.trim();
  if(!code){alert("입장 코드를 입력해주세요.");return;}
  if(code===state.adminCode){
    state.logged=true;
    state.admin=true;
    state.tab="home";
    app();
    return;
  }
  if(code===state.entryCode){
    state.logged=true;
    state.admin=false;
    state.tab="home";
    app();
    return;
  }
  alert("입장 코드가 올바르지 않습니다.");
}

function logout(){
  state.logged=false;
  state.admin=false;
  state.tab="home";
  app();
}
function go(tab){
  if(tab==="admin" && !state.admin){
    alert("관리자만 접근할 수 있습니다.");
    return;
  }
  state.tab=tab;
  app();
}
function render(){

  const m=document.getElementById("main");

  if(state.tab==="home"){
    m.innerHTML=home();
  }

  if(state.tab==="practice"){
    m.innerHTML=practice();
  }

  if(state.tab==="schedule"){

    m.innerHTML=schedule();

    document
      .querySelectorAll("[data-member]")
      .forEach(button=>{

        button.addEventListener(
          "click",
          ()=>selectAvailabilityMember(
            button.dataset.member
          )
        );

      });

  }

  if(state.tab==="calendar"){
    m.innerHTML=calendar();
  }

  if(state.tab==="notice"){
    m.innerHTML=notice();
  }

  if(state.tab==="admin"){
    m.innerHTML=admin();
  }

}

function home(){
  const d=Math.ceil((new Date(state.showDate)-new Date())/86400000);
  const special=state.notices.find(n=>n.special);
  return `
    <section class="hero">
      <div class="dday">D-${Math.max(d,0)}</div>
      <p>공연까지 · ${state.showDate.slice(5).replace('-','/')} ${state.showTime}</p>
      <p>${state.venue}</p>
    </section>
    ${special?`<div class="card"><div class="row"><h3>🚨 특수공지</h3><span class="pill">고정 1개</span></div><div class="notice"><b>${special.title}</b><br><span class="muted">${special.text}</span></div></div>`:""}
    <div class="card">
      <div class="section-title"><h3>📌 다가오는 주요 일정</h3><button class="btn" onclick="go('calendar')">전체보기</button></div>
      ${state.stage.slice(0,3).map(x=>`<div class="schedule-item"><span class="pill">${x.title.includes("공연")?"🎭 공연":"🏗️ 극장"}</span><div class="time">${x.date.slice(5).replace('-','/')} · ${x.time}</div><div class="people">${x.title}</div></div>`).join("")}
    </div>
    <div class="card">
      <div class="section-title"><h3>📅 다음 연습</h3><button class="btn" onclick="go('practice')">일정 보기</button></div>
      ${state.schedules.slice(0,3).map(x=>`<div class="schedule-item"><div class="row"><div><b>${x.date.slice(5).replace('-','/')}</b><div class="time">${x.time}</div></div><span class="pill">${x.people.length}명</span></div><div class="people">${x.title}</div></div>`).join("")}
    </div>
    <div class="card">
      <h3>👥 팀원</h3>
      ${state.members.length?state.members.map(x=>`<div class="listline"><div><b>${x.name}</b><br><span class="muted">${x.pos}${x.phone?` · ${x.phone}`:""}</span></div></div>`).join(""):`<div class="empty">등록된 팀원이 없습니다.</div>`}
    </div>`;
}
function movePracticeDate(days){
  if(!state.practiceDate){
    state.practiceDate=state.schedules.length
      ? state.schedules[0].date
      : new Date().toISOString().slice(0,10);
  }

  const [y,m,d]=state.practiceDate.split("-").map(Number);
  const date=new Date(y,m-1,d);

  if(state.view==="week"){
    date.setDate(date.getDate() + (days * 7));
  }else{
    date.setDate(date.getDate() + days);
  }

  state.practiceDate=
    `${date.getFullYear()}-`+
    `${String(date.getMonth()+1).padStart(2,"0")}-`+
    `${String(date.getDate()).padStart(2,"0")}`;

  save();
  render();
}

function practice(){
  const schedules=[...state.schedules].sort(
    (a,b)=>(a.date+a.time).localeCompare(b.date+b.time)
  );

  if(!state.practiceDate){
    state.practiceDate=schedules.length
      ? schedules[0].date
      : new Date().toISOString().slice(0,10);
  }

  function dateObj(str){
    const [y,m,d]=str.split("-").map(Number);
    return new Date(y,m-1,d);
  }

  function formatDate(d){
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,"0");
    const day=String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  const selected=dateObj(state.practiceDate);

  let list=[];

  if(state.view==="day"){
    list=schedules.filter(x=>x.date===state.practiceDate);
  }

  if(state.view==="week"){
    const weekStart=new Date(selected);
    weekStart.setDate(selected.getDate()-selected.getDay());

    const weekEnd=new Date(weekStart);
    weekEnd.setDate(weekStart.getDate()+6);

    list=schedules.filter(x=>{
      const d=dateObj(x.date);
      return d>=weekStart && d<=weekEnd;
    });
  }

  const dateLabel=
    `${selected.getFullYear()}년 ${selected.getMonth()+1}월 ${selected.getDate()}일`;

let weekLabel="";

if(state.view==="week"){
  const weekStart=new Date(selected);
  weekStart.setDate(selected.getDate()-selected.getDay());

  const weekEnd=new Date(weekStart);
  weekEnd.setDate(weekStart.getDate()+6);

  weekLabel=
    `${weekStart.getFullYear()}년 `
    +`${weekStart.getMonth()+1}월 ${weekStart.getDate()}일`
    +` ~ `
    +`${weekEnd.getFullYear()}년 `
    +`${weekEnd.getMonth()+1}월 ${weekEnd.getDate()}일`;
}

  return `
  <div class="section-title">
    <h2>연습일정</h2>
    ${state.admin
      ? '<button class="btn primary" onclick="addPractice()">+ 일정 추가</button>'
      : ''}
  </div>

  <div class="seg">
    <button class="${state.view==='day'?'active':''}"
      onclick="setView('day')">일간</button>

    <button class="${state.view==='week'?'active':''}"
      onclick="setView('week')">주간</button>

    <button class="${state.view==='month'?'active':''}"
      onclick="setView('month')">월간</button>
  </div>

  ${state.view!=="month" ? `
    <div class="card" style="margin-bottom:12px">
      <div class="row">
        <button class="btn" onclick="movePracticeDate(-1)">◀</button>

        <b>
          ${state.view==="day"
            ? dateLabel
            : weekLabel}
        </b>

        <button class="btn" onclick="movePracticeDate(1)">▶</button>
      </div>
    </div>
  ` : ""}

  ${state.view==="month"
    ? miniMonth()
    : list.length
      ? list.map(x=>{
          const originalIndex=state.schedules.indexOf(x);

          return `
          <div class="card">
            <div class="row">
              <div>
                <span class="pill">${x.date}</span>
                <div class="time">${x.time}</div>
                <b>${x.title}</b>
              </div>

              <span class="pill">
                👥 ${x.people.length}명
              </span>
            </div>

            <div class="people">
              ${x.people.join(" · ")}
            </div>

            ${state.admin ? `
              <div class="actions" style="margin-top:10px">
                <button class="btn ghost"
                  onclick="editPractice(${originalIndex})">수정</button>

                <button class="btn danger"
                  onclick="cancelPractice(${originalIndex})">취소</button>
              </div>
            ` : ""}
          </div>
          `;
        }).join("")
      : `<div class="card empty">
          해당 기간에 등록된 연습 일정이 없습니다.
        </div>`
  }`;
}
function setView(v){state.view=v;save();render()}
function miniMonth(){
  const base = state.practiceDate
    ? new Date(state.practiceDate + "T00:00:00")
    : new Date();

  const year = base.getFullYear();
  const month = base.getMonth();

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);

  const days = ["일","월","화","수","목","금","토"];

let s = `
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
    <button class="btn" onclick="movePracticeMonth(-1)">◀</button>
    <b style="font-size:18px;">${year}년 ${month + 1}월</b>
    <button class="btn" onclick="movePracticeMonth(1)">▶</button>
  </div>

  <div class="calendar">
`;
  s += days.map(d => `<div class="calhead">${d}</div>`).join("");

  for(let i=0; i<firstDay.getDay(); i++){
    s += `<div class="day"></div>`;
  }

  for(let day=1; day<=lastDay.getDate(); day++){
    const date =
      `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    const hit = Array.isArray(state.schedules)
       && state.schedules.some(x => x.date === date);

    s += `
      <div class="day">
        <b>${day}</b>
        ${hit ? `<span class="dot">● 연습</span>` : ""}
      </div>
    `;

function availabilityCalendar(){

  const year=
    availabilityCalendarDate.getFullYear();

  const month=
    availabilityCalendarDate.getMonth();


  const firstDay=
    new Date(year,month,1);

  const lastDay=
    new Date(year,month+1,0);


  const days=[
    "일","월","화","수","목","금","토"
  ];


  const member=
    document.getElementById(
      "availabilityMember"
    )?.value || "";


  const entries=
    member
      ? getMemberAvailability(member)
      : {};


  let html=`

    <div class="availability-calendar-header">

      <button
        type="button"
        class="btn"
        onclick="moveAvailabilityMonth(-1)">

        ◀

      </button>


      <b>
        ${year}년 ${month+1}월
      </b>


      <button
        type="button"
        class="btn"
        onclick="moveAvailabilityMonth(1)">

    </div>


    <div class="availability-calendar">

      ${days.map(d=>`
        <div class="calhead">
          ${d}
        </div>
      `).join("")}

  `;


  for(
    let i=0;
    i<firstDay.getDay();
    i++
  ){

    html+=`
      <div class="availability-day empty"></div>
    `;

  }


  for(
    let day=1;
    day<=lastDay.getDate();
    day++
  ){

    const date=
      `${year}-`+
      `${String(month+1).padStart(2,"0")}-`+
      `${String(day).padStart(2,"0")}`;


    const selected=
      selectedAvailabilityDates.includes(date);


    const registered=
      entries[date];


    html+=`

     <button
  type="button"
  class="availability-day ${
    selected ? "selected" : ""
  }"
  data-availability-date="${date}"
  onclick="toggleAvailabilityDate('${date}')">

        <b>${day}</b>

                  line-height:1.3;
                  font-weight:600">

                ${registered.time}

              </span>
            `
            : ""
        }

      </button>

    `;

  }


  html+=`

    </div>

  `;


  return html;

}

function renderAvailabilityTimes(){

  const area=

  let html="";


  const step=
    availabilityHalfHour
      ? 30
      : 60;

    h++

      m<60;

    ){

        `${String(m).padStart(2,"0")}`;


      const selected=
        selectedAvailabilityTimes
          .includes(time);


      const rangeStart=
        availabilityRangeStart===time;


      html+=`

        <button
          type="button"
          class="time-slot
            ${selected?"on":""}
            ${rangeStart?"range-start":""}"
          onclick="toggleAvailabilityTime('${time}')">

          ${time}

        </button>

      `;

    }

  }


  area.innerHTML=`

   30분 단위 전환
   ========================================================= */

function toggleAvailabilityHalfHour(){

  availabilityHalfHour=
    !availabilityHalfHour;


  selectedAvailabilityTimes=[];

  availabilityRangeStart=null;


  renderAvailabilityTimes();

}


/* =========================================================
   시간 선택
   ========================================================= */

function toggleAvailabilityTime(time){

  if(
    availabilityRangeStart===null
  ){

    availabilityRangeStart=time;

    renderAvailabilityTimes();

    return;

  }


  const startMinutes=
    availabilityTimeToMinutes(
      availabilityRangeStart
    );


  const endMinutes=
    availabilityTimeToMinutes(time);


  const from=
    Math.min(
      startMinutes,
      endMinutes
    );


  const to=
    Math.max(
      startMinutes,
      endMinutes
    );


  const step=
    availabilityHalfHour
      ? 30
      : 60;


  const range=[];


  for(
    let t=from;
    t<=to;
    t+=step
  ){

    range.push(
      availabilityMinutesToTime(t)
    );

  }


  selectedAvailabilityTimes=
    [
      ...new Set([
        ...selectedAvailabilityTimes,
        ...range
      ])
    ];


  selectedAvailabilityTimes.sort();


  availabilityRangeStart=null;


  renderAvailabilityTimes();

}


/* =========================================================
   시간 → 분
   ========================================================= */

function availabilityTimeToMinutes(time){

  const parts=
    time.split(":");


  return(
    Number(parts[0])*60+
    Number(parts[1])
  );

}


/* =========================================================
   분 → 시간
   ========================================================= */

function availabilityMinutesToTime(minutes){

  const h=
    Math.floor(minutes/60);


  const m=
    minutes%60;


  return(
    `${String(h).padStart(2,"0")}:`+
    `${String(m).padStart(2,"0")}`
  );

}

/* =========================================================
   팀원 가능시간 데이터 가져오기
   ========================================================= */

function getMemberAvailability(member){

  const result={};


  Object.entries(
    state.availability||{}
  ).forEach(([date,value])=>{

    /*
     * 새 데이터 구조
     */
    if(Array.isArray(value)){

      const found=
        value.find(
          x=>x.member===member
        );


      if(found){

        result[date]=found;

      }

      return;

    }


    /*
     * 예전 데이터 구조와 호환
     */
    if(
      value &&
      value.member===member
    ){

      result[date]=value;

    }

  });


  return result;

}

function saveAvailability(){

  const member=
    document.getElementById(
      "availabilityMember"
    )?.value || "";


  if(!member){

    alert(
      "이름을 먼저 선택해주세요."
    );

    return;

  }


  if(!selectedAvailabilityDates.length){

    alert(
      "날짜를 하나 이상 선택해주세요."
    );

    return;

  }


  if(!selectedAvailabilityTimes.length){

    alert(
      "가능한 시간을 하나 이상 선택해주세요."
    );

    return;

  }


  const memo=
    document.getElementById(
      "memo"
    )?.value.trim() || "";


  const time=
    selectedAvailabilityTimes
      .slice()
      .sort()
      .join(", ");


  if(!state.availability){

    state.availability={};

  }


  selectedAvailabilityDates.forEach(date=>{

    /*
     * 기존 구조가 배열이 아니면
     * 새 구조로 변환
     */
    if(
      !Array.isArray(
        state.availability[date]
      )
    ){

      const old=
        state.availability[date];


      state.availability[date]=
        old
        ? [old]
        : [];

    }


    const list=
      state.availability[date];


    const existing=
      list.find(
        x=>x.member===member
      );


    if(existing){

      existing.time=time;

      existing.memo=memo;

    }else{

      list.push({

        member:member,

        time:time,

        memo:memo

      });

    }

  });


  save();


  alert(
    `${selectedAvailabilityDates.length}개 날짜의 가능 시간이 저장되었습니다.`
  );


  selectedAvailabilityDates=[];

  selectedAvailabilityTimes=[];

  availabilityRangeStart=null;


  render();

  selectAvailabilityMember(member);
}


/* =========================================================
   가능시간 삭제
   ========================================================= */

function deleteAvailability(date,member){

  if(
    !confirm(
      `${date}의 가능시간을 삭제할까요?`
    )
  ){

    return;

  }


  const value=
    state.availability?.[date];


  if(Array.isArray(value)){

    state.availability[date]=
      value.filter(
        x=>x.member!==member
      );


    if(
      state.availability[date].length===0
    ){

      delete state.availability[date];

    }

  }else{

    if(
      value &&
      value.member===member
    ){

      delete state.availability[date];

    }

  }


save();

selectedAvailabilityDates =
  selectedAvailabilityDates.filter(
    x => x !== date
  );

updateSelectedMemberAvailability();
}

  const allSelected=

/* =========================================================

   ========================================================= */

function filterPeople(){

  const selected=
    [

/* =========================================================
   실제 공통 가능시간 계산
   ========================================================= */

function findCommonAvailability(members){

  const result={};


  Object.keys(
    state.availability||{}
  ).forEach(date=>{

    const value=
      state.availability[date];


    let list=[];


    if(Array.isArray(value)){

      list=value;

    }else if(value){

      list=[value];

    }


    const memberData=
      members.map(member=>
        list.find(
          x=>x.member===member
        )
      );


    if(
      memberData.some(
        x=>!x
      )
    ){

      return;

    }


    const common=
      getCommonTimeSlots(
        memberData.map(
          x=>x.time
        )
      );


    if(common.length){

      result[date]=common;

    }

  });


  return result;

}


/* =========================================================
   공통 시간 계산
   ========================================================= */

function getCommonTimeSlots(timeLists){

  if(!timeLists.length)return[];


  const sets=
    timeLists.map(text=>{

      return new Set(
        String(text)
          .split(",")
          .map(x=>x.trim())
          .filter(Boolean)
      );

    });


  const first=
    [...sets[0]];


  return first.filter(
    time=>
      sets.every(
        set=>set.has(time)
      )
  );

}


/* =========================================================
   연습 확정
   ========================================================= */

function confirmPractice(){

  const selected=
    [
      ...document.querySelectorAll(
        ".chip.on"
      )
    ].map(
      x=>x.dataset.name
    );


  if(!selected.length){

    alert(
      "먼저 연습할 팀원을 선택해주세요."
    );

    return;

  }


  const common=
    findCommonAvailability(
      selected
    );


  const dates=
    Object.keys(common);


  if(!dates.length){

    alert(
      "선택한 팀원의 공통 가능시간이 없습니다."
    );

    return;

  }


  const date=
    prompt(
      "확정 날짜\n\n"+
      dates.join("\n"),
      dates[0]
    );


  if(!date)return;


  if(!common[date]){

    alert(
      "공통 가능시간이 없는 날짜입니다."
    );

    return;

  }


  const time=
    prompt(
      "확정 시간\n\n"+
      common[date].join(", "),
      common[date][0]
    );


  if(!time)return;


  state.schedules.push({

    date:date,

    time:time,

    title:"확정 연습",

    people:selected

  });


  save();


  alert(
    "연습일정에 추가되었습니다."
  );


  go("practice");

}
function calendar(){
  return `<div class="section-title"><h2>주요 일정</h2>${state.admin?'<button class="btn primary" onclick="addStage()">+ 일정 추가</button>':''}</div>
  <div class="seg"><button class="active">월간</button><button onclick="alert('주간 보기로 전환됩니다.')">주간</button><button onclick="alert('일간 보기로 전환됩니다.')">일간</button></div>
  <div class="calendar">${["일","월","화","수","목","금","토"].map(d=>`<div class="calhead">${d}</div>`).join("")}${[...Array(31)].map((_,i)=>{
    let n=i+1;
    let ss=state.stage.filter(x=>Number(x.date.slice(-2))===n);
    let pr=state.schedules.filter(x=>Number(x.date.slice(-2))===n);
    return `<div class="day"><b>${n}</b>${ss.map(x=>`<span class="dot ${x.title.includes("공연")?"show":"stage"}">${x.title.includes("공연")?"🎭 공연":"🏗️ 극장"}</span>`).join("")}${pr.length?`<span class="dot">● 연습 ${pr.length}</span>`:""}</div>`;
  }).join("")}</div>
  <div class="card"><h3>📌 고정 주요 일정</h3>${state.stage.length?state.stage.map((x,i)=>`<div class="schedule-item"><span class="pill">${x.title.includes("공연")?"🎭 공연":"🏗️ 극장"}</span><div class="time">${x.date} · ${x.time}</div><div class="people">${x.title}</div>${state.admin?`<div class="actions" style="margin-top:8px"><button class="btn" onclick="editStage(${i})">수정</button><button class="btn danger" onclick="deleteStage(${i})">삭제</button></div>`:""}</div>`).join(""):`<div class="empty">등록된 주요 일정이 없습니다.</div>`}</div>`;
}
function addStage(){
  let date=prompt("날짜","2026-10-25");if(!date)return;
  let time=prompt("시간","13:00–21:00");if(!time)return;
  let title=prompt("일정명","극장 입성 · 셋업 · 리허설");if(!title)return;
  state.stage.push({date,time,title});save();render();
}
function editStage(i){
  let x=state.stage[i];
  x.time=prompt("시간",x.time)||x.time;
  x.title=prompt("일정명",x.title)||x.title;
  save();render();
}
function deleteStage(i){
  if(confirm("주요 일정을 삭제할까요?")){state.stage.splice(i,1);save();render();}
}

function notice(){
  return `<div class="section-title"><h2>공지 & 자료</h2>${state.admin?'<button class="btn primary" onclick="addNotice()">+ 작성</button>':''}</div>
  <div class="seg"><button class="active">전체</button><button>공연음악</button><button>연습영상</button><button>연습이미지</button></div>

function addNotice(){
  let type=prompt("항목: 일반공지 / 공연음악 / 연습영상 / 연습이미지","일반공지");if(!type)return;
  let title=prompt("제목","새 공지");if(!title)return;
  let text=prompt("내용","내용을 입력하세요")||"";
  state.notices.unshift({type,title,text,author:"관리자",special:false});
  save();render();
}
function toggleSpecial(i){
  state.notices.forEach((n,j)=>n.special=j===i?!n.special:false);
  save();render();
}
function deleteNotice(i){
  if(confirm("이 공지/자료를 삭제할까요?")){state.notices.splice(i,1);save();render();}
}

    <p class="muted small">기본 코드는 일반 방문자용, 관리자 코드는 관리자용입니다. 두 코드는 다르게 설정하세요.</p>

function saveShowInfo(){
  state.showName=document.getElementById("showName").value.trim()||state.showName;
  state.venue=document.getElementById("venue").value.trim()||state.venue;
  state.showDate=document.getElementById("showDate").value||state.showDate;
  state.showTime=document.getElementById("showTime").value.trim()||state.showTime;
  save();alert("공연 정보가 저장되었습니다.");app();
}
function addMember(){
  const name=prompt("팀원 이름");
  if(!name)return;

  const pos=prompt("포지션","배우");
  if(!pos)return;

  state.members.push({
    name:name.trim(),
    pos:pos.trim(),
    joined:true
  });

  save();
  render();
}
function editMember(i){
  const m=state.members[i];

  m.name=prompt("이름",m.name)||m.name;
  m.pos=prompt("포지션",m.pos)||m.pos;

  delete m.phone;

  save();
  render();
}
function deleteMember(i){
  if(confirm(`${state.members[i].name} 팀원을 삭제할까요?`)){
    state.members.splice(i,1);save();render();
  }
}
function saveCodes(){
  const entry=document.getElementById("newEntryCode").value.trim();
  const admin=document.getElementById("newAdminCode").value.trim();
  if(!entry||!admin){alert("두 코드를 모두 입력해주세요.");return;}
  if(entry===admin){alert("기본 입장 코드와 관리자 코드는 서로 다르게 설정해주세요.");return;}
  state.entryCode=entry;
  state.adminCode=admin;
  save();
  alert("입장 코드가 저장되었습니다. 다음 입장부터 적용됩니다.");
  app();
}
function resetShow(){
  if(confirm("정말 공연 데이터를 초기화할까요?")){
    state.schedules=[];
    state.stage=[];
    state.notices=[];
    state.availability={};
    save();
    render();
    alert("공연 데이터가 초기화되었습니다.");
  }
}

app();
